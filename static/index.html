<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redoland</title>
<style>
  :root { --bg:#14110e; --panel:#1d1813; --ink:#ece3d4; --dim:#9a8f7d;
          --accent:#c8743a; --line:#332a20; --good:#6fae6f; --bad:#cc5b5b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--ink); }
  header { padding:11px 18px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:baseline; }
  header b { color:var(--accent); font-size:16px; letter-spacing:1px; }
  header .run { color:var(--dim); }
  #livebtn { margin-left:auto; font:inherit; cursor:pointer; padding:3px 10px;
             background:#0f0d0a; color:var(--ink); border:1px solid var(--line);
             border-radius:5px; }
  #livebtn.on { color:#14110e; background:var(--bad); border-color:var(--bad);
                animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  .wrap { display:grid; grid-template-columns:150px 1fr 300px; height:calc(100vh - 47px); }
  .col { overflow:auto; padding:14px; }
  .col + .col { border-left:1px solid var(--line); }
  h3 { margin:0 0 10px; color:var(--dim); font-weight:600; text-transform:uppercase;
       font-size:11px; letter-spacing:1.2px; }
  /* year tabs */
  .yr { display:block; width:100%; text-align:left; padding:7px 11px; margin-bottom:5px;
        border:1px solid var(--line); border-radius:6px; background:var(--panel);
        color:var(--ink); cursor:pointer; font:inherit; }
  .yr:hover { border-color:var(--dim); }
  .yr.sel { background:var(--accent); color:#14110e; border-color:var(--accent);
            font-weight:700; }
  /* transcript */
  .ev { padding:5px 0; border-bottom:1px dashed var(--line); display:flex; gap:10px; }
  .ev .k { color:var(--dim); min-width:62px; font-size:11px; padding-top:2px;
           text-transform:uppercase; }
  .ev .who { color:var(--accent); }
  .ev.narrate .who, .ev.birth .who { color:var(--good); }
  .ev.death .who, .ev.outcome .who { color:var(--bad); }
  .ev.attack .k, .ev.blow .k, .ev.muster .k, .ev.join .k, .ev.flee .k,
  .ev.submit .k, .ev.cancel .k { color:var(--bad); }
  .ev.eat { opacity:.55; }
  .ev.say .k, .ev.convo .k { color:var(--accent); }
  .ev.say { font-style:italic; }
  .empty { color:var(--dim); }
  /* stats */
  table.stats { width:100%; border-collapse:collapse; }
  table.stats td { padding:3px 4px; border-bottom:1px solid var(--line); }
  table.stats td:last-child { text-align:right; color:var(--accent); }
  table.stats tr.head td { color:var(--dim); text-transform:uppercase; font-size:10px;
        letter-spacing:1px; border-bottom:1px solid var(--line); padding-top:10px; }
  table.stats td.sub { color:var(--dim); padding-left:16px; }
</style>
</head>
<body>
<header>
  <b>REDOLAND</b><span class="run" id="runname"></span>
  <button id="livebtn" onclick="toggleLive()">● Live</button>
</header>
<div class="wrap">
  <div class="col" id="left"><h3>Years</h3><div id="years"></div></div>
  <div class="col" id="center"><h3 id="ttitle">Transcript</h3><div id="events"></div></div>
  <div class="col" id="right"><h3>Stats <span id="slabel" style="color:var(--accent)"></span></h3>
    <table class="stats"><tbody id="stats"></tbody></table></div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = p => fetch(p).then(r => r.json());
const escapeHtml = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let YEARS = [], SEL = null, ES = null;

// kinds hidden from the transcript (private bookkeeping / noise).
// 'eat' (year-end) IS shown — just dimmed — so the year-end phase is visible.
const HIDE = new Set(['pass','compaction','under_attack']);

async function loadYears(keepSel){
  const tree = await api('/api/tree');
  const main = (tree.branches||[]).find(b => b.branch === 'main');
  YEARS = main ? main.years : [];
  renderYears();
  if (!ES && (SEL===null || !YEARS.includes(SEL)) && YEARS.length)
    selectYear(YEARS[YEARS.length-1]);
}

function renderYears(){
  const el = $('years'); el.innerHTML = '';
  YEARS.forEach(y => {
    const b = document.createElement('button');
    b.className = 'yr' + (y===SEL && !ES ? ' sel' : '');
    b.textContent = 'Year ' + y;
    b.onclick = () => { if (ES) toggleLive(); selectYear(y); };
    el.appendChild(b);
  });
}

async function selectYear(y){
  SEL = y; renderYears();
  $('ttitle').textContent = 'Transcript — year ' + y;
  $('slabel').textContent = 'year ' + y;
  const d = await api(`/api/year?b=main&y=${y}`);
  renderEvents(d.events || []);
  renderStats(d.metrics || {});
}

function renderEvents(events){
  const el = $('events'); el.innerHTML = '';
  const shown = events.filter(e => !HIDE.has(e.kind));
  if (!shown.length){ el.innerHTML = '<div class="empty">A quiet year — nothing of note.</div>'; return; }
  shown.forEach(e => el.appendChild(evRow(e)));
}

function evRow(e){
  const d = document.createElement('div');
  d.className = 'ev ' + (e.kind||'');
  d.innerHTML = `<div class="k">${e.kind||''}</div><div style="flex:1">`+
    `<span class="who">${e.who||''}</span>${e.text? ': '+escapeHtml(e.text) : ''}</div>`;
  return d;
}

const STAT_ROWS = [
  ['__h','POPULATION'],
  ['population','people'], ['ever_lived','ever lived'], ['births','births'],
  ['max_generation','generations'], ['mean_age','avg age'],
  ['__h','DEATHS'],
  ['deaths_total','total'], ['deaths_starvation','• starvation','sub'],
  ['deaths_combat','• combat','sub'], ['deaths_natural','• old age','sub'],
  ['__h','RESOURCES'],
  ['food_total','food held'], ['food_gini','food Gini (inequality)'],
  ['__h','AVERAGES'],
  ['mean_strength','strength'], ['mean_hp','HP'],
  ['mean_openness','openness'], ['mean_conscientiousness','conscientiousness'],
  ['mean_extraversion','extraversion'], ['mean_agreeableness','agreeableness'],
  ['mean_neuroticism','neuroticism'],
  ['mean_intelligence_tokens','intelligence'], ['mean_memory_tokens','memory'],
];

function renderStats(m){
  const t = $('stats'); t.innerHTML = '';
  STAT_ROWS.forEach(([key,label,cls]) => {
    if (key === '__h'){
      const tr = document.createElement('tr'); tr.className='head';
      tr.innerHTML = `<td colspan="2">${label}</td>`; t.appendChild(tr); return;
    }
    if (!(key in m)) return;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td${cls?' class="'+cls+'"':''}>${label}</td><td>${m[key]}</td>`;
    t.appendChild(tr);
  });
  if (!t.children.length) t.innerHTML = '<tr><td class="empty">no data</td></tr>';
}

// --- live turn-by-turn feed (optional) ---
function toggleLive(){
  const btn = $('livebtn');
  if (ES){ ES.close(); ES = null; btn.classList.remove('on'); btn.textContent = '● Live';
    if (SEL!==null) selectYear(SEL); loadYears(); return; }
  $('ttitle').textContent = 'Live — streaming as the run happens';
  $('slabel').textContent = 'live'; $('events').innerHTML = '';
  renderYears();
  ES = new EventSource('/api/live');
  ES.onmessage = ev => { let e; try { e = JSON.parse(ev.data); } catch(_){ return; }
    if (HIDE.has(e.kind)) return;
    const el = $('events'); el.appendChild(evRow(e));
    while (el.children.length > 600) el.removeChild(el.firstChild);
    $('center').scrollTop = $('center').scrollHeight; };
  btn.classList.add('on'); btn.textContent = '● LIVE';
}

const u = new URLSearchParams(location.search);
$('runname').textContent = '· ' + (u.get('run')||'');
loadYears();
setInterval(() => { if (!ES) loadYears(true); }, 3000);  // pick up new years during a run
</script>
</body>
</html>
