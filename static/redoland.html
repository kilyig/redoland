<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redoland</title>
<style>
  :root { --bg:#14110e; --panel:#1d1813; --ink:#ece3d4; --dim:#9a8f7d;
          --accent:#c8743a; --line:#332a20; --good:#6fae6f; --bad:#cc5b5b; --blue:#5a8fb0; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; background:var(--bg); color:var(--ink); }
  header { padding:9px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { color:var(--accent); font-size:16px; letter-spacing:1px; }
  select, input, button { font:inherit; background:#0f0d0a; color:var(--ink); border:1px solid var(--line); border-radius:5px; padding:4px 8px; }
  input { width:64px; } input.name { width:120px; }
  button { cursor:pointer; } button:hover { border-color:var(--dim); }
  button.go { background:var(--accent); color:#14110e; border-color:var(--accent); font-weight:700; }
  .sep { width:1px; align-self:stretch; background:var(--line); margin:0 2px; }
  .status { margin-left:auto; color:var(--dim); }
  .status.run { color:var(--bad); animation:pulse 1.1s infinite; cursor:pointer; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .wrap { display:grid; grid-template-columns:130px 1fr 320px; height:calc(100vh - 86px); }
  .col { overflow:auto; padding:12px; } .col + .col { border-left:1px solid var(--line); }
  h3 { margin:0 0 9px; color:var(--dim); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:1.2px; }
  .yr { display:block; width:100%; text-align:left; padding:6px 10px; margin-bottom:4px; border:1px solid var(--line);
        border-radius:6px; background:var(--panel); color:var(--ink); cursor:pointer; }
  .yr:hover { border-color:var(--dim); } .yr.sel { background:var(--accent); color:#14110e; border-color:var(--accent); font-weight:700; }
  .ev { padding:4px 0; border-bottom:1px dashed var(--line); display:flex; gap:9px; }
  .ev .k { color:var(--dim); min-width:58px; font-size:10px; padding-top:2px; text-transform:uppercase; }
  .ev .who { color:var(--accent); }
  .ev.narrate .who, .ev.birth .who { color:var(--good); } .ev.death .who, .ev.outcome .who { color:var(--bad); }
  .ev.attack .k, .ev.blow .k, .ev.muster .k, .ev.join .k, .ev.flee .k, .ev.submit .k { color:var(--bad); }
  .ev.eat { opacity:.5; } .ev.say .k, .ev.convo .k { color:var(--accent); } .ev.say { font-style:italic; }
  .empty { color:var(--dim); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button.on { background:var(--accent); color:#14110e; border-color:var(--accent); }
  table.stats { width:100%; border-collapse:collapse; }
  table.stats td { padding:2px 4px; border-bottom:1px solid var(--line); }
  table.stats td:last-child { text-align:right; color:var(--accent); }
  table.stats tr.head td { color:var(--dim); text-transform:uppercase; font-size:9px; letter-spacing:1px; padding-top:9px; }
  .dist { margin-bottom:12px; } .dist .lbl { color:var(--dim); display:flex; justify-content:space-between; margin-bottom:3px; }
  .dist .lbl b { color:var(--ink); }
  .bars { display:flex; align-items:flex-end; gap:2px; height:46px; }
  .bars .bar { flex:1; background:var(--blue); border-radius:2px 2px 0 0; min-height:2px; }
  .bars .bar.acc { background:var(--accent); }
</style>
</head>
<body>
<header>
  <b>REDOLAND</b>
  <select id="runsel" onchange="selectRun(this.value)"></select>
  <select id="brsel" onchange="selectBranch(this.value)"></select>
  <span class="sep"></span>
  <span>new:</span>
  <input class="name" id="nname" placeholder="name">
  <input id="nfound" value="6" title="founders"><input id="nseed" value="1" title="seed">
  <input id="nratio" value="1.5" title="ratio"><input id="nyears" value="3" title="years">
  <button class="go" onclick="newWorldline()">Start</button>
  <span class="sep"></span>
  <input id="cyears" value="3" title="years"><button onclick="continueWorldline()">Continue</button>
  <button onclick="forkWorldline()" title="fork the selected year into a new worldline">Fork @year</button>
  <span class="status" id="status" onclick="goLive()" title="click to follow the live run">idle</span>
</header>
<div class="wrap">
  <div class="col" id="left"><h3>Years</h3><div id="years"></div></div>
  <div class="col" id="center"><h3 id="ttitle">Transcript</h3><div id="events"></div></div>
  <div class="col" id="right">
    <div class="tabs"><button id="tabSum" class="on" onclick="showTab('sum')">Summary</button>
      <button id="tabDist" onclick="showTab('dist')">Distributions</button></div>
    <div id="sum"></div><div id="dist" style="display:none"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const api = (p) => fetch(p).then(r => r.json());
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const HIDE = new Set(['pass','compaction','under_attack']);
let RUN=null, BR=null, YEARS=[], SEL=null, ES=null, TAB='sum', LASTDIST={};
let FOLLOW=true;   // auto-follow the live feed of a running job (off once you pick a year)
let JOB_RUN=null, JOB_BR=null;   // the currently running job's run/branch (for "go live")

async function loadRuns(){
  const d = await api('/api/runs'); const sel = $('runsel');
  sel.innerHTML = '<option value="">— run —</option>' + d.runs.map(r=>`<option ${r===RUN?'selected':''}>${r}</option>`).join('');
  if (!RUN && d.runs.length) selectRun(d.runs[0]);
}
async function selectRun(r){ RUN=r; $('runsel').value=r; BR=null; await loadTree(); }
async function loadTree(keepYear){
  if (!RUN){ $('brsel').innerHTML=''; return; }
  const t = await api('/api/tree?run='+encodeURIComponent(RUN));
  const branches = (t.branches||[]);
  $('brsel').innerHTML = branches.map(b=>`<option ${b.branch===BR?'selected':''}>${b.branch}</option>`).join('');
  if (!BR && branches.length) BR = branches[0].branch;
  const cur = branches.find(b=>b.branch===BR) || branches[0];
  YEARS = cur ? cur.years : [];
  renderYears();
  if (!ES && (!keepYear || !YEARS.includes(SEL)) && YEARS.length) selectYear(YEARS[YEARS.length-1]);
}
function selectBranch(b){ FOLLOW=false; stopLive(); BR=b; SEL=null; loadTree(); }
function renderYears(){
  $('years').innerHTML='';
  YEARS.forEach(y=>{ const btn=document.createElement('button');
    btn.className='yr'+(y===SEL&&!ES?' sel':''); btn.textContent='Year '+y;
    btn.onclick=()=>{ FOLLOW=false; stopLive(); selectYear(y); }; $('years').appendChild(btn); });
}
async function selectYear(y){
  SEL=y; renderYears(); $('ttitle').textContent='Transcript — year '+y;
  const d = await api(`/api/year?run=${encodeURIComponent(RUN)}&b=${BR}&y=${y}`);
  renderEvents(d.events||[]); renderStats(d.metrics||{}, d.dist||{});
}
function renderEvents(events){
  const el=$('events'); el.innerHTML='';
  const shown = events.filter(e=>!HIDE.has(e.kind));
  if (!shown.length){ el.innerHTML='<div class="empty">A quiet year — nothing of note.</div>'; return; }
  shown.forEach(e=>el.appendChild(evRow(e)));
}
function evRow(e){ const d=document.createElement('div'); d.className='ev '+(e.kind||'');
  d.innerHTML=`<div class="k">${e.kind||''}</div><div style="flex:1"><span class="who">${esc(e.who)}</span>${e.text?': '+esc(e.text):''}</div>`; return d; }

const SUM_ROWS=[['__h','POPULATION'],['population','people'],['ever_lived','ever lived'],['births','births'],
 ['max_generation','generations'],['mean_age','avg age'],['__h','DEATHS'],['deaths_total','total'],
 ['deaths_starvation','• starvation'],['deaths_combat','• combat'],['deaths_natural','• old age'],
 ['__h','RESOURCES'],['food_total','food held'],['food_gini','food Gini'],
 ['__h','AVERAGES'],['mean_strength','strength'],['mean_hp','HP'],['mean_intelligence_tokens','intelligence'],
 ['mean_memory_tokens','memory'],['mean_openness','openness'],['mean_conscientiousness','conscientiousness'],
 ['mean_extraversion','extraversion'],['mean_agreeableness','agreeableness'],['mean_neuroticism','neuroticism']];
function renderStats(m, dist){
  LASTDIST = dist; const t=$('sum'); t.innerHTML='<table class="stats"><tbody></tbody></table>';
  const tb=t.querySelector('tbody');
  SUM_ROWS.forEach(([k,l])=>{ if(k==='__h'){ const tr=document.createElement('tr'); tr.className='head';
      tr.innerHTML=`<td colspan=2>${l}</td>`; tb.appendChild(tr); return; }
    if(!(k in m)) return; const tr=document.createElement('tr');
    tr.innerHTML=`<td>${l}</td><td>${m[k]}</td>`; tb.appendChild(tr); });
  renderDist(dist);
}
const DIST_SPECS=[['food','Wealth (food)','acc'],['intelligence','Intelligence (think tokens)'],
 ['memory','Memory (context)'],['age','Age'],['strength','Strength'],['hp','HP'],
 ['openness','Openness'],['conscientiousness','Conscientiousness'],['extraversion','Extraversion'],
 ['agreeableness','Agreeableness'],['neuroticism','Neuroticism']];
function histo(vals, bins){
  if(!vals||!vals.length) return null;
  const mn=Math.min(...vals), mx=Math.max(...vals); const counts=new Array(bins).fill(0);
  const span=(mx-mn)||1; vals.forEach(v=>{ let i=Math.floor((v-mn)/span*bins); if(i>=bins)i=bins-1; if(i<0)i=0; counts[i]++; });
  return {counts, mn, mx, max:Math.max(...counts)};
}
function renderDist(dist){
  const el=$('dist'); el.innerHTML='';
  if(!dist || !dist.food){ el.innerHTML='<div class="empty">no data</div>'; return; }
  DIST_SPECS.forEach(([key,label,cls])=>{
    const vals=dist[key]; if(!vals||!vals.length) return;
    const h=histo(vals, 12); if(!h) return;
    const mean=(vals.reduce((a,b)=>a+b,0)/vals.length);
    const wrap=document.createElement('div'); wrap.className='dist';
    const bars=h.counts.map(c=>`<div class="bar ${cls||''}" style="height:${Math.round(c/h.max*100)}%" title="${c}"></div>`).join('');
    wrap.innerHTML=`<div class="lbl"><span>${label}</span><b>μ ${mean.toFixed(mean<10?1:0)} · ${h.mn}–${h.mx}</b></div><div class="bars">${bars}</div>`;
    el.appendChild(wrap);
  });
}
function showTab(t){ TAB=t; $('sum').style.display=t==='sum'?'':'none'; $('dist').style.display=t==='dist'?'':'none';
  $('tabSum').className=t==='sum'?'on':''; $('tabDist').className=t==='dist'?'on':''; }

// -- worldline actions --
async function post(url, body){ return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()); }
async function newWorldline(){
  const name=$('nname').value.trim(); if(!name){ alert('name?'); return; }
  const r=await post('/api/new',{name, founders:+$('nfound').value, seed:+$('nseed').value, ratio:+$('nratio').value, years:+$('nyears').value});
  if(!r.ok){ alert(r.error); return; } RUN=name; BR='main'; startLive();
}
async function continueWorldline(){
  if(!RUN||!BR) return; const r=await post('/api/continue',{run:RUN, branch:BR, years:+$('cyears').value});
  if(!r.ok){ alert(r.error); return; } startLive();
}
async function forkWorldline(){
  if(!RUN||!BR||SEL==null) return; const name=prompt('new worldline name:', BR+'_fork');
  if(!name) return; const yrs=prompt('run how many years on the fork?', '3'); if(yrs==null) return;
  const r=await post('/api/fork',{run:RUN, parent:BR, year:SEL, name, years:+yrs});
  if(!r.ok){ alert(r.error); return; } BR=null; startLive();
}

// -- status + live --
async function pollStatus(){
  const s=await api('/api/status'); const el=$('status');
  if(s.busy){ el.className='status run'; el.textContent=`● ${s.phase}${s.branch?' · '+s.branch:''}`;
    JOB_RUN=s.run; JOB_BR=s.branch;
    if(FOLLOW){   // only auto-jump to the running job's live feed while following
      if(s.run && s.run!==RUN){ RUN=s.run; $('runsel').value=RUN; } if(s.branch) BR=s.branch;
      if(!ES) startLive();
    }
  } else {
    el.className='status'; el.textContent = s.error? ('error: '+s.error) : 'idle';
    if(ES){ stopLive(); loadRuns(); loadTree(true); }
  }
}
function startLive(){
  FOLLOW=true;   // entering live (via an action or while following) re-enables follow
  if(ES) return; $('ttitle').textContent='Live — streaming the run';
  $('events').innerHTML=''; SEL=null; renderYears();
  ES=new EventSource('/api/live?run='+encodeURIComponent(RUN));
  ES.onmessage=ev=>{ let e; try{e=JSON.parse(ev.data);}catch(_){return;} if(HIDE.has(e.kind)) return;
    const el=$('events'); el.appendChild(evRow(e)); while(el.children.length>800) el.removeChild(el.firstChild);
    $('center').scrollTop=$('center').scrollHeight; };
}
function stopLive(){ if(ES){ ES.close(); ES=null; } }
function goLive(){   // re-follow the running job's live feed (status bar is clickable)
  if(!JOB_RUN) return;
  RUN=JOB_RUN; $('runsel').value=RUN; if(JOB_BR) BR=JOB_BR;
  startLive();
}

loadRuns();
setInterval(pollStatus, 1500);
setInterval(()=>{ if(!ES) loadTree(true); }, 4000);
</script>
</body>
</html>
